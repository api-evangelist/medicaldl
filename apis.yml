name: Zhuhai DL Biotech (medicaldl)
description: >-
  Zhuhai DL Biotech Co., Ltd. (Zhuhai Deer Bioengineering Co., Ltd., brand "DL"
  / 迪尔), founded in 2003 and based in Zhuhai, China, is a high-tech in-vitro
  diagnostics (IVD) enterprise specializing in the R&D, manufacturing, and
  service of microbial diagnostic instruments and reagents. Its product lines
  cover automated blood culture systems, automated bacterial identification and
  antimicrobial susceptibility testing (ID/AST), MALDI-TOF mass spectrometry
  microbial identification, automated staining, fluorescence immunoassay, and
  molecular diagnostics, serving over 5,000 clinical healthcare institutions
  across more than 50 countries. Surfaced as a portfolio company of Qiming
  Venture Partners. Enrichment pass found no public API, developer portal, SDK,
  or software integration surface — this is a diagnostic-hardware and reagent
  business, not a software/API provider.
